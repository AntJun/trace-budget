[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-budget"
version = "0.1.0"
description = "Performance budgets and review reports for Chrome Trace Event captures"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "AntJun"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Benchmark",
]

[project.scripts]
tracebudget = "tracebudget.__main__:main"

[project.urls]
Repository = "https://github.com/AntJun/trace-budget"
Issues = "https://github.com/AntJun/trace-budget/issues"

[tool.setuptools.packages.find]
include = ["tracebudget*"]
